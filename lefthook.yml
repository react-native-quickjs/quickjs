pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{c,h,cpp,mm}"
      # A list of globs, not one string: lefthook reads a bare string as a
      # regular expression, in which `**` means "zero or more asterisks"
      # rather than "any path". Written that way these exclusions never
      # match, and vendored code gets checked against our style.
      exclude:
        - "engine/**"
        - "tools/aot/**"   # the AOT generator and its tests are tooling that has never been formatted
        - "tests/third_party/**"
        # modules/napi/include/*.h are Node's own headers, copied verbatim,
        # and modules/napi/cpp/** is a fork of an external node-api
        # implementation. Reformatting either would bury every real change in
        # noise and make the parity diff against Node worthless.
        - "modules/napi/include/**"
        - "modules/napi/cpp/**"
        - "android/src/main/jni/JJSRuntimeFactory.h"
      run: clang-format --dry-run --Werror {staged_files}

    # The engine submodule must be at the commit the repository records, with no uncommitted edits: an engine change is a commit in
    # the fork (engine/README.md), and the main repository records its pointer. Checking this only in `prepack` is too late.
    engine-check:
      glob:
        - "engine/**"
        - "scripts/**"
        - ".gitmodules"
      run: node scripts/check-engine.js

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
