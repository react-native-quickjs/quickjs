# Builds the bytecode compiler for every host an app is built on, and opens a
# pull request with the binaries.
#
# Bytecode is only loadable by the engine build that produced it, so a compiler
# and an engine agree or nothing works. BC_VERSION is what says whether they
# still do: the engine defines it, the manifest records what the committed
# compilers were built for, and this runs whenever the two differ.
name: bytecode compilers

on:
  push:
    branches: [main]
    paths: ['engine/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bytecode-compilers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          node -e "
            const fs = require('fs');
            const engine = fs.readFileSync('engine/quickjs-rel/quickjs.c', 'utf8');
            const version = Number(/^#define BC_VERSION (\d+)/m.exec(engine)[1]);
            const path = 'bin/qjsc/manifest.json';
            const built = fs.existsSync(path)
              ? JSON.parse(fs.readFileSync(path, 'utf8')).bcVersion
              : null;
            console.log('version=' + version);
            console.log('stale=' + (built !== version));
            console.error(\`engine BC_VERSION \${version}, compilers built for \${built}\`);
          " >> "$GITHUB_OUTPUT"

  build:
    needs: check
    # A manual run rebuilds regardless: the reason to reach for it is a
    # compiler that is wrong for a reason BC_VERSION did not capture.
    if: needs.check.outputs.stale == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          - { os: macos-13, platform: darwin-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: windows-latest, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The engine sources are committed, so the submodule is not needed.
      # --ignore-scripts skips the postinstall that would fetch and patch it;
      # react-native is still installed, which cmake/jsi.cmake checks for.
      - run: npm ci --ignore-scripts

      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target qjsc --config Release

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          # Multi-config generators put it under a configuration directory.
          binary=$(find build -name 'qjsc' -o -name 'qjsc.exe' | head -1)
          cp "$binary" out/
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip "out/$(basename "$binary")"
          fi
          # Apple Silicon refuses to run a binary whose signature does not
          # cover its contents -- stripping invalidates the one clang applies
          # at link time, and the result is killed on launch rather than
          # reported. Re-signing ad-hoc is what makes it runnable again.
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --sign - --force "out/qjsc"
            codesign --verify --verbose "out/qjsc"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: qjsc-${{ matrix.platform }}
          path: out/*

  commit:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place the binaries and record what they were built for
        run: |
          for dir in artifacts/qjsc-*; do
            platform="${dir#artifacts/qjsc-}"
            mkdir -p "bin/qjsc/$platform"
            cp "$dir"/* "bin/qjsc/$platform/"
            chmod +x "bin/qjsc/$platform"/*
          done
          node -e "
            const fs = require('fs');
            fs.writeFileSync('bin/qjsc/manifest.json', JSON.stringify({
              _comment: 'Generated by .github/workflows/bytecode-compilers.yml. Do not edit.',
              bcVersion: ${{ needs.check.outputs.version }},
              platforms: fs.readdirSync('bin/qjsc').filter((e) => e !== 'manifest.json').sort(),
            }, null, 2) + '\n');
          "
          cat bin/qjsc/manifest.json

      # A pull request rather than a push to main: these are binaries, and one
      # that lands unreviewed is one nobody ever looks at.
      #
      # A pull request opened with GITHUB_TOKEN does not start other workflows,
      # so the test suite will not run on it by itself. Pushing an empty commit
      # to the branch, or closing and reopening it, gets a run.
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          branch="bytecode-compilers/bc-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"

          git add bin/qjsc
          if git diff --cached --quiet; then
            echo 'the committed compilers already match; nothing to open'
            exit 0
          fi

          git commit -m "build: rebuild the bytecode compilers for BC_VERSION $VERSION"
          git push --force -u origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            echo 'a pull request for this branch is already open'
            exit 0
          fi

          platforms=$(cd bin/qjsc && ls -1d */ | sed 's|/$||' | sed 's|^|- |')
          printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "The engine's BC_VERSION is now $VERSION, which the committed compilers were not built for." \
            "Bytecode is only loadable by the engine build that produced it, so they are rebuilt here for every host." \
            "$platforms" \
            "Built from $SOURCE_SHA by .github/workflows/bytecode-compilers.yml." > body.md

          gh pr create --base main --head "$branch" \
            --title "Rebuild the bytecode compilers for BC_VERSION $VERSION" \
            --body-file body.md
